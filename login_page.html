
<div style="min-height: 100vh; background: var(--color-background-tertiary); display: flex; align-items: center; justify-content: center; padding: 2rem 1rem; font-family: var(--font-sans);">

  <div style="width: 100%; max-width: 400px;">

    <div style="text-align: center; margin-bottom: 2rem;">
      <div style="width: 44px; height: 44px; background: var(--color-background-primary); border: 0.5px solid var(--color-border-tertiary); border-radius: var(--border-radius-lg); display: flex; align-items: center; justify-content: center; margin: 0 auto 1rem;">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="var(--color-text-primary)" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="12" cy="8" r="4"/><path d="M4 20c0-4 3.6-7 8-7s8 3 8 7"/>
        </svg>
      </div>
      <h1 style="font-size: 20px; font-weight: 500; color: var(--color-text-primary); margin: 0 0 6px;">Welcome back</h1>
      <p style="font-size: 14px; color: var(--color-text-secondary); margin: 0;">Sign in to your account to continue</p>
    </div>

    <div style="background: var(--color-background-primary); border: 0.5px solid var(--color-border-tertiary); border-radius: var(--border-radius-lg); padding: 1.75rem;">

      <div style="margin-bottom: 1rem;">
        <label style="display: block; font-size: 13px; font-weight: 500; color: var(--color-text-secondary); margin-bottom: 6px;">Email address</label>
        <input type="email" placeholder="you@example.com" style="width: 100%; box-sizing: border-box;" />
      </div>

      <div style="margin-bottom: 1.5rem;">
        <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 6px;">
          <label style="font-size: 13px; font-weight: 500; color: var(--color-text-secondary);">Password</label>
          <a href="#" style="font-size: 12px; color: var(--color-text-info); text-decoration: none;">Forgot password?</a>
        </div>
        <div style="position: relative;">
          <input type="password" id="pw" placeholder="••••••••" style="width: 100%; box-sizing: border-box; padding-right: 40px;" />
          <button onclick="togglePw()" style="position: absolute; right: 10px; top: 50%; transform: translateY(-50%); background: none; border: none; cursor: pointer; padding: 0; color: var(--color-text-tertiary); display: flex; align-items: center;">
            <svg id="eye-icon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
              <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/>
            </svg>
          </button>
        </div>
      </div>

      <div style="display: flex; align-items: center; gap: 8px; margin-bottom: 1.5rem;">
        <input type="checkbox" id="remember" style="width: 16px; height: 16px; cursor: pointer;" />
        <label for="remember" style="font-size: 13px; color: var(--color-text-secondary); cursor: pointer;">Remember me for 30 days</label>
      </div>

      <button onclick="handleLogin()" style="width: 100%; padding: 10px; background: var(--color-text-primary); color: var(--color-background-primary); border: none; border-radius: var(--border-radius-md); font-size: 14px; font-weight: 500; cursor: pointer; transition: opacity 0.15s;">
        Sign in
      </button>

      <div style="display: flex; align-items: center; gap: 10px; margin: 1.25rem 0;">
        <div style="flex: 1; height: 0.5px; background: var(--color-border-tertiary);"></div>
        <span style="font-size: 12px; color: var(--color-text-tertiary);">or continue with</span>
        <div style="flex: 1; height: 0.5px; background: var(--color-border-tertiary);"></div>
      </div>

      <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 8px;">
        <button style="display: flex; align-items: center; justify-content: center; gap: 6px; padding: 9px; font-size: 13px;">
          <svg width="16" height="16" viewBox="0 0 24 24"><path d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z" fill="#4285F4"/><path d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z" fill="#34A853"/><path d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z" fill="#FBBC05"/><path d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z" fill="#EA4335"/></svg>
          Google
        </button>
        <button style="display: flex; align-items: center; justify-content: center; gap: 6px; padding: 9px; font-size: 13px;">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="var(--color-text-primary)"><path d="M12 0C5.37 0 0 5.37 0 12c0 5.31 3.435 9.795 8.205 11.385.6.105.825-.255.825-.57 0-.285-.015-1.23-.015-2.235-3.015.555-3.795-.735-4.035-1.41-.135-.345-.72-1.41-1.23-1.695-.42-.225-1.02-.78-.015-.795.945-.015 1.62.87 1.845 1.23 1.08 1.815 2.805 1.305 3.495.99.105-.78.42-1.305.765-1.605-2.67-.3-5.46-1.335-5.46-5.925 0-1.305.465-2.385 1.23-3.225-.12-.3-.54-1.53.12-3.18 0 0 1.005-.315 3.3 1.23.96-.27 1.98-.405 3-.405s2.04.135 3 .405c2.295-1.56 3.3-1.23 3.3-1.23.66 1.65.24 2.88.12 3.18.765.84 1.23 1.905 1.23 3.225 0 4.605-2.805 5.625-5.475 5.925.435.375.81 1.095.81 2.22 0 1.605-.015 2.895-.015 3.3 0 .315.225.69.825.57A12.02 12.02 0 0 0 24 12c0-6.63-5.37-12-12-12z"/></svg>
          GitHub
        </button>
      </div>
    </div>

    <p style="text-align: center; font-size: 13px; color: var(--color-text-secondary); margin-top: 1.25rem;">
      Don't have an account? <a href="#" style="color: var(--color-text-info); text-decoration: none; font-weight: 500;">Sign up</a>
    </p>

  </div>
</div>

<div id="toast" style="display: none; position: fixed; bottom: 24px; left: 50%; transform: translateX(-50%); background: var(--color-text-primary); color: var(--color-background-primary); font-size: 13px; padding: 10px 18px; border-radius: var(--border-radius-md);">Signed in successfully!</div>

<script>
function togglePw() {
  const pw = document.getElementById('pw');
  pw.type = pw.type === 'password' ? 'text' : 'password';
}
function handleLogin() {
  const toast = document.getElementById('toast');
  toast.style.display = 'block';
  setTimeout(() => toast.style.display = 'none', 2500);
}
</script>
